version: '3.8'

services:
  app:
    build: .
    container_name: sbiz-asset-app
    ports:
      - "8080:80"
    volumes:
      - ./apps:/var/www/html
    depends_on:
      - db
    networks:
      - sbiz-network

  db:
    image: mariadb:10.1.19
    container_name: sbiz-asset-db
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=sbiz_asset
    ports:
      - "3306:3306"
    volumes:
      - ./mysql-data:/var/lib/mysql
      # Use either structure-only.sql or struucture-with-data-sample.sql
      - ./data-sample/struucture-with-data-sample.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - sbiz-network

networks:
  sbiz-network:
    driver: bridge
